[package]
name = "client_auth_classic"
version = "0.1.0"
edition = "2024"

[dependencies]

core_utils_classic   = { path = "../core_utils_classic" }
base65 = { path = "../base65" }
ed25519-dalek = { version = "3.0.0", features = ["serde", "rand_core"] }
x25519-dalek = { version = "3.0.0"  }
getrandom = { version = "0.4.3", features = ["sys_rng"] }

tokio = { version = "1", features = ["full"] }
csv = "1.4"


useful_stats = { path = "../../evals/useful_stats" }

env = { version = "1.0.1" }


[features]
trace = ["core_utils_classic/trace"]