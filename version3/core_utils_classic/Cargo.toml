[package]
name = "core_utils_classic"
version = "0.1.0"
edition = "2024"

[dependencies]
base65 = { path = "../base65" }


soft-aes = "0.2.2"
ed25519-dalek = { version = "3.0.0", features = ["serde", "rand_core"] }
x25519-dalek = { version = "3.0.0", features = ["serde"] }
getrandom = { version = "0.4.3", features = ["sys_rng"] }


serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1", features = ["full"] }
postcard = { version = "1", features = ["alloc"] }
rand = "0.10.1"  
tokio-postgres = { version = "0.7", features = ["with-serde_json-1"] }
chrono = { version = "0.4", features = ["serde"] }

chacha20 = { version = "0.10.1", features = ["cipher"] }
ntrulp = { version = "0.2.5", features = ["ntrup653", "std"] } 
