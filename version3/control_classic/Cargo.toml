[package]
name = "control_classic"
version = "0.1.0"
edition = "2024"

[dependencies]
base65 = { path = "../base65" }


soft-aes = "0.2.2"
serde = { version = "1.0.228", features = ["derive"] }

postcard = { version = "1.1.3", features = ["alloc"] }

ed25519-dalek = { version = "3.0.0", features = ["serde", "rand_core"] }
getrandom = { version = "0.4.3", features = ["sys_rng"] }
rand_core = "0.10.1"